spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/dorandoran?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: [사용자계정] # 보통 root
    password: [비밀번호]
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 엔티티 수정 시 DB 테이블 자동 반영
    show-sql: true # 실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true # SQL을 예쁘게 포맷팅