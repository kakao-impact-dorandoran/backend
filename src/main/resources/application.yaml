spring:
  application:
    name: backend

  datasource:
    # docker-compose.yml 의 MySQL 서비스(3306, db: dorandoran)에 맞춤
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dorandoran}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:dorandoran}
    password: ${DB_PASSWORD:dorandoran1234!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # D-1: 초기 속도와 유연성을 위해 update 유지 (MVP)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul

server:
  port: 8080

# JWT 설정 (D-2: jjwt + Spring Security)
#  - secret 는 운영 환경에서는 반드시 환경변수로 주입할 것
#  - access: 1시간, refresh: 14일 기본값
dorandoran:
  jwt:
    secret: ${JWT_SECRET:dorandoran-local-dev-secret-key-please-change-in-production-32bytes-min!!}
    access-token-validity-ms: 3600000        # 1h
    refresh-token-validity-ms: 1209600000    # 14d
    issuer: dorandoran

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
